[project]
name = "paungflow-dashboard"
version = "1.0.0"
description = "Lower Paung-Luang dam inflow forecasting dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.21",
    "SQLAlchemy==2.0.48",
    "PyMySQL==1.1.2",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "numpy==2.5.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "scripts", "tests"]
exclude = [".tmp", ".pip-cache", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
    "B008",  # FastAPI depends on call defaults in function signatures.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
"app/web/assets/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "constants"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["^data/", "^\\.tmp/", "^\\.pip-cache/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
